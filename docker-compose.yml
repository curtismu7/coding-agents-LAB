# OrbStack:  HOST_PORT=7150 docker compose up --build -d   ->  http://127.0.0.1:7150
# The server binds 0.0.0.0 INSIDE the container (CALAB_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 7150-7199. CODING_AGENTS_LAB_MODE=live opens the page in Live mode
# (still loopback, no outbound). Mock is the default.
name: coding-agents-lab

services:
  coding-agents-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7150}:7150"
    environment:
      PORT: "7150"
      CALAB_BIND: 0.0.0.0
      CODING_AGENTS_LAB_MODE: ${CODING_AGENTS_LAB_MODE:-mock}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-}
    # Real mode needs the owner-set AI Gateway endpoint + bearer (shared settings file, rule 19/94);
    # host-gateway is only reachable names for the netguard's one allowed outbound.
    env_file:
      - path: ${STANDALONE_ENV:-/Users/cmuir/Development/.env}
        required: false
    extra_hosts:
      - "local.ping-devops.com:host-gateway"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7150/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
